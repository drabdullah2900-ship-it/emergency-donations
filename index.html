<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تبرعات الأدوية - إسعاف مشفى حلب الجامعي</title>
    <!-- استدعاء مكتبة Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استدعاء خطوط النسخ العربية -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Naskh Arabic', serif;
            background-color: #f8fafc;
        }
        .card-hover {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="text-gray-800">

    <!-- قسم الترويسة مع صورة المشفى -->
    <!-- يمكنك لاحقاً استبدال هذا الرابط برابط صورة المشفى التي أرسلتها بعد رفعها على درايف -->
    <header class="relative bg-cover bg-center h-72 flex items-center justify-center text-center" 
            style="background-image: url('https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?q=80&w=2053&auto=format&fit=crop');">
        <!-- طبقة شفافة داكنة لجعل النص مقروءاً فوق الصورة -->
        <div class="absolute inset-0 bg-blue-900 bg-opacity-70"></div>
        
        <div class="relative z-10 text-white px-4">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">تبرعات الأدوية - الإسعاف الداخلي</h1>
            <p class="text-xl md:text-2xl opacity-90">مشفى حلب الجامعي - تحديث مباشر للحالة</p>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        
        <!-- شريط البحث السريع -->
        <div class="max-w-md mx-auto mb-10">
            <input type="text" id="searchInput" placeholder="ابحث عن اسم الدواء..." 
                   class="w-full px-5 py-3 rounded-full border-2 border-gray-300 focus:border-blue-500 focus:outline-none shadow-sm text-lg transition-colors"
                   onkeyup="filterMedications()">
        </div>

        <!-- شبكة عرض الأدوية -->
        <div id="medications-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-8">
            <p id="loading-msg" class="text-center col-span-full text-2xl text-gray-500 my-10">جاري الاتصال بقاعدة البيانات وتحميل الأدوية...</p>
        </div>

    </main>

    <script>
        // === المتغيرات الرئيسية ===
        // تم إضافة المعرف الخاص بملف جوجل شيت الذي أرسلته
        const sheetId = '16Ce0qaYvpcc4o9WMWTHffDqCfw_AxIju'; 
        const url = `https://docs.google.com/spreadsheets/d/${sheetId}/gviz/tq?tqx=out:json`;
        
        // مصفوفة لتخزين البيانات عالمياً لاستخدامها في البحث
        let allMedications = [];

        // === دالة جلب البيانات ===
        async function fetchMedications() {
            try {
                const response = await fetch(url);
                
                // التحقق من نجاح الاتصال
                if (!response.ok) {
                    throw new Error('لم نتمكن من الوصول إلى الشيت. تأكد من إعدادات المشاركة.');
                }
                
                const text = await response.text();
                
                // تنظيف الرد للحصول على JSON
                const jsonString = text.substring(47).slice(0, -2);
                const jsonData = JSON.parse(jsonString);
                
                // تحويل الصفوف إلى كائنات برمجية
                const rows = jsonData.table.rows;
                
                // تجاوز الصف الأول (لأنه يحتوي على عناوين الأعمدة) باستخدام slice(1)
                allMedications = rows.slice(1).map(row => {
                    return {
                        name: (row.c[0] && row.c[0].v) ? row.c[0].v : 'غير محدد',
                        available: (row.c[1] && row.c[1].v) ? row.c[1].v : 0,
                        batch: (row.c[2] && row.c[2].f) ? row.c[2].f : ((row.c[2] && row.c[2].v) ? row.c[2].v : '-'),
                        consumed: (row.c[3] && row.c[3].v) ? row.c[3].v : 0,
                        image: (row.c[4] && row.c[4].v) ? row.c[4].v : 'https://via.placeholder.com/300?text=لا+توجد+صورة'
                    };
                });

                // إزالة رسالة التحميل وعرض البطاقات
                document.getElementById('loading-msg').style.display = 'none';
                renderCards(allMedications);

            } catch (error) {
                console.error("خطأ في جلب البيانات:", error);
                document.getElementById('medications-grid').innerHTML = 
                    `<p class="text-red-700 col-span-full text-center text-xl font-bold bg-red-100 p-4 rounded-lg">
                        حدث خطأ في تحميل البيانات.<br>
                        يرجى التأكد من أن إعدادات المشاركة في جوجل شيت مضبوطة على "أي شخص لديه الرابط" (Anyone with the link).
                    </p>`;
            }
        }

        // === دالة رسم البطاقات HTML ===
        function renderCards(data) {
            const grid = document.getElementById('medications-grid');
            grid.innerHTML = ''; 

            if(data.length === 0) {
                grid.innerHTML = '<p class="text-center col-span-full text-gray-500 text-lg">لم يتم العثور على أدوية مطابقة للبحث أو الشيت فارغ.</p>';
                return;
            }

            data.forEach(item => {
                // حساب النسبة التقريبية للاستهلاك (إذا كانت الكمية 10 أو أقل نعتبرها حالة حرجة)
                const isUrgent = parseInt(item.available) <= 10; 

                const card = `
                    <div class="card-hover bg-white rounded-2xl overflow-hidden border border-gray-100 relative shadow-sm">
                        ${isUrgent ? '<div class="absolute top-4 left-4 bg-red-500 text-white text-xs font-bold px-3 py-1 rounded-full shadow z-10">حاجة ماسة</div>' : ''}
                        
                        <div class="h-56 overflow-hidden bg-gray-50 flex justify-center items-center p-2 border-b">
                            <img src="${item.image}" alt="${item.name}" class="max-h-full max-w-full object-contain mix-blend-multiply" onerror="this.src='https://via.placeholder.com/300?text=صورة+غير+متوفرة'">
                        </div>
                        
                        <div class="p-6">
                            <h2 class="text-xl font-bold text-blue-900 mb-5 leading-tight h-14 overflow-hidden">${item.name}</h2>
                            
                            <div class="space-y-3 text-sm">
                                <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                                    <span class="text-gray-500">الكمية المتوفرة:</span>
                                    <span class="font-bold text-lg ${isUrgent ? 'text-red-600' : 'text-green-600'} bg-gray-50 px-3 py-1 rounded-lg">${item.available}</span>
                                </div>
                                <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                                    <span class="text-gray-500">الكمية المستهلكة:</span>
                                    <span class="font-bold text-orange-600">${item.consumed}</span>
                                </div>
                                <div class="flex justify-between items-center pt-1">
                                    <span class="text-gray-500 text-xs">تاريخ آخر دفعة:</span>
                                    <span class="text-gray-700 text-xs font-mono bg-gray-100 px-2 py-1 rounded" dir="ltr">${item.batch}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                grid.innerHTML += card;
            });
        }

        // === دالة البحث (التصفية) ===
        function filterMedications() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filteredData = allMedications.filter(med => med.name.toLowerCase().includes(query));
            renderCards(filteredData);
        }

        // تشغيل الكود عند فتح الصفحة
        window.onload = fetchMedications;
    </script>
</body>
</html>
